<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - aks job listing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background: #f6f8fa; margin: 0; padding: 0; }
        .signup-container { max-width: 400px; margin: 80px auto; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 36px 32px; }
        h2 { color: #2563eb; text-align: center; margin-bottom: 24px; }
        form { display: flex; flex-direction: column; gap: 18px; }
        label { font-weight: 600; color: #2563eb; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { padding: 10px; border: 1.5px solid #e0e7ef; border-radius: 8px; font-size: 1rem; }
        button { padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1746a2; }
        .errorlist { color: #d7263d; margin-bottom: 10px; list-style: none; padding: 0; }
        .back-link { display: inline-block; margin-top: 18px; color: #2563eb; text-decoration: none; font-weight: 600; text-align: center; width: 100%; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Sign Up</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>
        <a href="/login/" class="back-link">Already have an account? Login</a>
        <a href="/" class="back-link">&larr; Back to Jobs</a>
    </div>
</body>
</html>
